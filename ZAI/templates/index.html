{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZAI-APP</title>

  <script src="{% static 'vendor/js/bootstrap.bundle.min.js' %}"></script>
  <link rel="stylesheet" href="{% static 'vendor/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  
</head>
<body>
  {% verbatim %}
  <div id="app" v-cloak>
    <!-- Nav bar -->
    <div id="app-nav-bar">
      <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top px-3">
        <a class="navbar-brand">ZAI</a>
        <button class="navbar-toggler" type="button" 
          data-bs-toggle="collapse" data-bs-target="#navbarContent" 
          aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation"
          >
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse inline-flex justify-content-between" id="navbarContent">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#" @click.prevent="state.page = 'home'">Visualize</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="#" @click.prevent="state.page = 'manage-series'">Series</a>
            </li>
            <li class="nav-item" v-if="isAuthenticated">
              <a class="nav-link" aria-current="page" href="#" @click.prevent="state.page = 'manage-sensors'">Sensors</a>
            </li>
          </ul>

          <div id="navbar-auth-div">
            <template v-if="isAuthenticated">
              <span class="navbar-text">Welcome, {{ auth?.username ?? '' }}</span>
              <button id="btn-change-password" type="button" class="btn" @click.prevent="state.page = 'user-change-password'">Change Password</button>
              <button id="btn-logout" type="button" class="btn" @click.prevent="logout">Logout</button>
            </template>
            
            <template v-else>
              <span class="navbar-text">Not logged in</span>
              <button id="btn-login" type="button" class="btn" @click.prevent="state.page = 'user-login'">Login</button>
            </template>
          </div>
        </div>
      </nav>
    </div>

    <main id="app-content" class="app-main m-3">
      <component :is="state.page" @logged-in="state.page = 'home'"/>
    </main>
  </div>

  <template id="tpl-user-login">
    <section v-if="!isAuthenticated">
      <h1>Log in</h1>
      <form @submit.prevent="login">
        <input v-model="credentials.username" placeholder="Login" required>
        <input v-model="credentials.password" type="password" placeholder="Password" required>
        <button type="submit" :disabled="saving">Log in</button>
      </form>
      <p v-if="error" class="error">{{ error }}</p>
    </section>
    <section v-else><span>Already logged in</span></section>
  </template>


  <template id="tpl-user-change-password">
    <section v-if="!isAuthenticated">
      <h1>Change password</h1>
      <form @submit.prevent="changePassword">
        <input v-model="passwords.currentPassword" type="password" placeholder="Current password" required>
        <input v-model="passwords.newPassword" type="password" placeholder="New Password" required>
        <button type="submit" :disabled="saving">Change password</button>
      </form>
      <p v-if="error" class="error">{{ error }}</p>
    </section>
    <section v-else><span>Not logged in, access forbidden</span></section>

  </template>


  <template id="tpl-home">
    <div class="view-fill">
      <h1>Measurements</h1>
      <div>
        <button class="btn btn-sm btn-secondary" type="button" :disabled="loading" data-bs-toggle="modal" data-bs-target="#measurementsFilterModal">
          Filters
        </button>
        <button class="btn btn-sm btn-secondary mx-3" type="button" :disabled="loading" @click.prevent="getMeasurements">
          Refresh
        </button>
      </div>

      <!-- Modal Filter -->
      <div class="modal modal-fullscreen-sm-down fade" id="measurementsFilterModal" tabindex="-1" aria-labelledby="measurementsFilterModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="measurementsFilterModalLabel">Filter Measurements</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="form-filter-measurements" @submit.prevent="getMeasurements">
                 
                  <label for="inp-measurements-time-from">Time from</label>
                  <input class="form-control mb-3" v-model="measurementsFilterData.from" type="datetime-local" name="Measurements Time From" id="inp-measurements-time-from"/>
                  <label for="inp-measurements-time-to">Time to</label>
                  <input class="form-control mb-3" v-model="measurementsFilterData.to" type="datetime-local" name="Measurements Time To" id="inp-measurements-time-to"/>
                  <label for="inp-measurements-series-id">Series</label>
                  <input class="form-control mb-3" v-model="measurementsFilterData.series" type="text" name="Measurements from Series ids" id="inp-measurements-series-id"/>
                  <div class="mt-3" v-if="measurementsFilterError != ''">{{ measurementsFilterError }} {{ measurementsFilterErrorValues }}</div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="submit" form="form-filter-measurements" class="btn btn-primary">Confirm</button>
            </div>
          </div>
        </div>
      </div>

      <div class="measurement-view-row">
        <!-- Chart -->
        <div class="measurement-chart">
            Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

        </div>
        <!-- Table -->
        <div class="measurement-table">
          <div class="table-scroll">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Series ID</th>
                  <th scope="col">Sensor ID</th>
                  <th scope="col">Value</th>
                  <th scope="col">Time</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="m in measurementsData ?? []" :key="m.id">
                  <td>{{ m.id }}</td>
                  <td>{{ m.seriesId }}</td>
                  <td>{{ m.sensorId }}</td>
                  <td>{{ m.value }}</td>
                  <td>{{ m.timestamp }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      </div>
    </div>
  </template>


  <template id="tpl-manage-sensors">
    <div class="view-fill">
      <h1>Sensors</h1>
      <div>
        <button class="btn btn-sm btn-secondary" type="button" :disabled="loading" @click.prevent="getSensors">
          Get data
        </button>
        <button class="btn btn-sm btn-secondary mx-3" type="button" :disabled="loading" data-bs-toggle="modal" data-bs-target="#registerSensorModal">
          Register new
        </button>
      </div>

      <!-- Modal -->
      <div class="modal modal-fullscreen-sm-down fade" id="registerSensorModal" tabindex="-1" aria-labelledby="registerSensorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="registerSensorModalLabel">Add Sensor</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" @click.prevent="registerSensorFormClear"></button>
            </div>
            <div class="modal-body">
              <form id="form-register-sensor" @submit.prevent="registerSensor">
                  <label for="inp-sensor-name">Name</label>
                  <input class="form-control mb-3" v-model="newSensorData.name" type="text" name="Sensor Name" id="inp-sensor-name"/>
                  <label for="inp-sensor-series-id">Series ID</label>
                  <input class="form-control" v-model="newSensorData.seriesId" type="number" step="1" name="Sensor Series ID" id="inp-sensor-series-id"/>
                  <div class="mt-3" v-if="newSensorAddError != ''">{{ newSensorAddError }} {{ newSensorAddErrorValues }}</div>
                  <div class="mt-3" v-if="newSensorKey != ''">API Key (only visible once): {{ newSensorKey }}</div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="submit" form="form-register-sensor" class="btn btn-primary">Confirm</button>
            </div>
          </div>
        </div>
      </div>
      
      <p>{{ error }}</p>
      <div class="table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Series ID</th>
              <th scope="col">Created</th>
              <th scope="col">Last measurement</th>
              <th scope="col">Active</th>
              <th scope="col" v-if="isAuthenticated">Options</th>
            </tr>
          </thead>
          <tbody >
            <tr v-for="s in sensorData?.value ?? []" :key="s.id">
              <td>{{ s.id }}</td>
              <td>{{ s.name }}</td>
              <td>{{ s.seriesId }}</td>
              <td>{{ s.createdAt }}</td>
              <td>{{ s.lastMeasurementAt }}</td>
              <td>{{ s?.isActive ?? '?' }}</td>
              <td v-if="isAuthenticated">
                <button class="btn btn-sm btn-danger" :disabled="!s?.isActive" type="button" @click.prevent="unregisterSensor(s.id)">
                  Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </template>


  <template id="tpl-manage-series">
    <div class="view-fill">
      <h1>Series</h1>
      <div>
        <button class="btn btn-sm btn-secondary" type="button" :disabled="loading" @click.prevent="getSeries">
          Get data
        </button>
        <button v-if="isAuthenticated" class="btn btn-sm btn-secondary mx-3" type="button" :disabled="loading" data-bs-toggle="modal" data-bs-target="#addSeriesModal">
          Add new
        </button>
      </div>

      <!-- Modal Add New-->
      <div class="modal modal-fullscreen-sm-down fade" id="addSeriesModal" tabindex="-1" aria-labelledby="addSeriesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="addSeriesModalLabel">Add Series</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" @click.prevent="addSeriesFormClear"></button>
            </div>
            <div class="modal-body">
              <form id="form-add-series" @submit.prevent="addSeries">
                 
                  <label for="inp-series-name">Name <span class="red-text">*</span></label>
                  <input class="form-control mb-3" v-model="newSeriesData.name" type="text" name="Series Name" id="inp-series-name" required/>
                  <label for="inp-series-min-value">Min Value <span class="red-text">*</span></label>
                  <input class="form-control mb-3" v-model="newSeriesData.minValue" type="number" name="Series min value" id="inp-series-min-value" required/>
                  <label for="inp-series-max-value">Max Value <span class="red-text">*</span></label>
                  <input class="form-control mb-3" v-model="newSeriesData.maxValue" type="number" name="Series max value" id="inp-series-max-value" required/>
                  <label for="inp-series-max-value">Color <span class="red-text">*</span></label>
                  <input class="form-control form-control-color mb-3" v-model="newSeriesData.color" type="color" name="Series color" id="inp-series-color" required/>
                  <label for="inp-series-max-value">Icon</label>
                  <input class="form-control mb-3" v-model="newSeriesData.icon" type="text" name="Series icon" id="inp-series-icon"/>
                  <label for="inp-series-max-value">Unit</label>
                  <input class="form-control mb-3" v-model="newSeriesData.unit" type="text" name="Series unit" id="inp-series-unit"/>
                  <div class="mt-3" v-if="newSeriesAddError != ''">{{ newSeriesAddError }} {{ newSeriesAddErrorValues }}</div>
                  <div class="mt-3" v-if="newSeriesId != ''">Success - new Series ID: {{ newSeriesId }}</div>
                  
              </form>
            </div>
            <div class="modal-footer">
              <button type="submit" form="form-add-series" class="btn btn-primary">Confirm</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Edit -->
      <div class="modal modal-fullscreen-sm-down fade" id="editSeriesModal" tabindex="-1" aria-labelledby="editSeriesModalLabel" aria-hidden="true" ref="modalEditSeries">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="editSeriesModalLabel">Edit Series (id: {{editSeriesData.id}})</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" @click.prevent="editSeriesFormClear"></button>
            </div>
            <div class="modal-body">
              <form id="form-edit-series" @submit.prevent="editSeries(editSeriesData.id)">
                  <label for="inp-series-name">Name <span class="red-text">*</span></label>
                  <input class="form-control mb-3" v-model="editSeriesData.name" type="text" name="Series Name" id="inp-series-name" required/>
                  <label for="inp-series-min-value">Min Value <span class="red-text">*</span></label>
                  <input class="form-control mb-3" v-model="editSeriesData.minValue" type="number" name="Series min value" id="inp-series-min-value" required/>
                  <label for="inp-series-max-value">Max Value <span class="red-text">*</span></label>
                  <input class="form-control mb-3" v-model="editSeriesData.maxValue" type="number" name="Series max value" id="inp-series-max-value" required/>
                  <label for="inp-series-max-value">Color <span class="red-text">*</span></label>
                  <input class="form-control form-control-color mb-3" v-model="editSeriesData.color" type="color" name="Series color" id="inp-series-color" required/>
                  <label for="inp-series-max-value">Icon</label>
                  <input class="form-control mb-3" v-model="editSeriesData.icon" type="text" name="Series icon" id="inp-series-icon"/>
                  <label for="inp-series-max-value">Unit</label>
                  <input class="form-control mb-3" v-model="editSeriesData.unit" type="text" name="Series unit" id="inp-series-unit"/>
                  <div class="mt-3" v-if="editSeriesAddError != ''">{{ editSeriesAddError }} {{ editSeriesAddErrorValues }}</div>
                  <div class="mt-3" v-if="editSeriesSuccess">Successfully edited values</div>

              </form>
            </div>
            <div class="modal-footer">
              <button type="submit" form="form-edit-series" class="btn btn-primary">Confirm</button>
            </div>
          </div>
        </div>
      </div>
      
      <p>{{ error }}</p>
      <div class="table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Min Value</th>
              <th scope="col">Max Value</th>
              <th scope="col">Unit</th>
              <th scope="col">Color</th>
              <th scope="col">Icon</th>
              <th scope="col" v-if="isAuthenticated">Options</th>
            </tr>
          </thead>
          <tbody >
            <tr v-for="s in seriesData?.value ?? []" :key="s.id">
              <td>{{ s.id }}</td>
              <td>{{ s.name }}</td>
              <td>{{ s.minValue }}</td>
              <td>{{ s.maxValue }}</td>
              <td>{{ s?.unit ?? 'N/A' }}</td>
              <td>{{ s.color }}</td>
              <td>{{ s?.icon ?? 'N/A' }}</td>
              <td v-if="isAuthenticated">
                <button class="btn btn-sm btn-warning" type="button" :disabled="loading" @click="openEditModal(s)">
                  Edit
                </button>
                <button class="btn btn-sm btn-danger mx-2" type="button" @click.prevent="deleteSeries(s.id)">
                  Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </template>
  {% endverbatim %}

  <script src="{% static 'vendor/js/vue.global.js' %}"></script>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/state.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  <script src="{% static 'vendor/js/echarts.min.js' %}"></script>
  <script src="{% static 'vendor/js/tabulator.min.js' %}"></script>
</body>
</html>
